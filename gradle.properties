# The release workflow checks that a pushed tag (v1.2.3) matches this version.
version=0.1.0

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official

# Databases whose JDBC drivers are packaged: all, or a comma-separated subset
# of sqlite,postgres. ClickHouse is spoken over HTTP and needs no driver.
# Example: ./gradlew installDist -Pdatabases=postgres
databases=all
