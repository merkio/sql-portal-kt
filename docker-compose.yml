# Local playground: the portal with the bundled local environment (auth off,
# in-memory SQLite demo data, text logs).
#   docker compose up --build
#   portal: http://localhost:8080   metrics: http://localhost:8080/metrics
services:
  portal:
    build: .
    image: script-portal:local
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      SCRIPT_PORTAL_LOG: info
      # A cluster-like run (JSON logs, auth on) needs more variables:
      # APP_ENV: k8s
      # DATABASE_URL: postgres://user:pass@db/app
      # LDAP_ENABLED: "true"
      # LDAP_URL: ldaps://ldap.example.org
      # LDAP_BIND_DN: cn=svc-portal,ou=services,dc=example,dc=org
      # LDAP_BIND_PASSWORD: change-me
      # LDAP_BASE_DN: ou=people,dc=example,dc=org
      # An extra HOCON file on top of the bundled configuration:
      # SCRIPT_PORTAL_CONFIG: /config/override.conf
    # volumes:
    #   - ./my-config:/config:ro
    restart: unless-stopped
