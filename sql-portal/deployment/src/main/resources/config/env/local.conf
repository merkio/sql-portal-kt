# APP_ENV=local (the default): a developer machine or the demo image.
# Authentication is OFF and the database is an in-memory SQLite seeded with
# the demo data of migrations/sqlite. Logs are plain text.

ui.title = "Script Portal (local)"

database {
  url = "sqlite::memory:"
  url = ${?DATABASE_URL}
  max_connections = 1           # in-memory SQLite is per connection
  migrations.enabled = true     # demo schema and data
  migrations.enabled = ${?MIGRATIONS_ENABLED}
}

auth {
  enabled = false               # master switch: disables ALL authorizers
  enabled = ${?AUTH_ENABLED}
}
