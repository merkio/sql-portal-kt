# APP_ENV=k8s: running in a Kubernetes cluster. uat and prod build on this.
# Logs are JSON (with MDC, app and env fields); metrics are scraped from
# /metrics by the cluster's Prometheus.
#
# Required:  DATABASE_URL
# Sign-in:   LDAP_ENABLED=true with LDAP_URL, LDAP_BIND_DN, LDAP_BIND_PASSWORD, LDAP_BASE_DN
#            and/or OIDC_ENABLED=true with OIDC_ISSUER_URL, OIDC_CLIENT_ID, OIDC_CLIENT_SECRET
# Usually:   PUBLIC_URL

server.session {
  secure = true                 # served over HTTPS behind the ingress
  secure = ${?COOKIE_SECURE}
}

database {
  url = ${DATABASE_URL}
  migrations.enabled = false
  migrations.enabled = ${?MIGRATIONS_ENABLED}
}

auth {
  enabled = true
  enabled = ${?AUTH_ENABLED}
}
