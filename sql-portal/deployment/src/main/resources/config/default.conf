# Script Portal: the default configuration, shared by every environment.
#
# Layers, the first one winning:
#   1. the file named by SCRIPT_PORTAL_CONFIG, optional
#   2. env/<APP_ENV>.conf         APP_ENV = local (default) | k8s | uat | prod
#   3. this file
#
# * HOCON (https://github.com/lightbend/config/blob/main/HOCON.md). Objects of
#   the layers merge key by key; lists (scripts, roles...) replace each other.
# * Environment variables:
#     key = default
#     key = ${?VAR}             # overrides the default when VAR is set
#     key = ${VAR}              # required: loading fails without VAR
#     key = "jdbc-like://${DB_USER}@db/${DB_NAME:-app}"
#                               # inside strings too; ${?VAR} is empty when unset,
#                               # $${ is a literal "${". Script SQL is never expanded.
# * Quote values that contain ':' or '//' (e.g. "sqlite::memory:", URLs).
# * Relative file paths are looked up next to the SCRIPT_PORTAL_CONFIG file first, then
#   among the bundled files (migrations/, scripts/).
# * Unknown keys are rejected, so a typo is an error instead of being ignored.

# Shared certificates for every TLS connection (database, LDAP, OIDC, grants
# service). Mount a Kubernetes kubernetes.io/tls secret and the CA, then point
# these at the files:
# tls {
#   ca_file = /etc/portal-tls/ca.crt
#   cert_file = /etc/portal-tls/tls.crt   # optional client certificate (mutual TLS)
#   key_file = /etc/portal-tls/tls.key    # LDAP/OIDC/HTTP: PEM (PKCS#8, PKCS#1 or SEC1);
#                                         # PostgreSQL: PKCS#8 DER (.pk8) or PKCS#12 (.p12)
#   insecure = false
# }

server {
  bind = "0.0.0.0:8080"
  bind = ${?SCRIPT_PORTAL_BIND}
  # Externally visible URL; the OIDC redirect URI is <public_url>/auth/callback.
  public_url = "http://localhost:8080"
  public_url = ${?PUBLIC_URL}
  session {
    cookie_name = sp_session
    # true when served over HTTPS. Behind a TLS-terminating proxy the proxy
    # must send X-Forwarded-Proto: https.
    secure = false
    secure = ${?COOKIE_SECURE}
    ttl_minutes = 60
  }
}

ui {
  title = "Script Portal"
  title = ${?UI_TITLE}
  # Point at a self-hosted copy (e.g. "/static/chart.js" behind a proxy) to avoid the CDN.
  chartjs_url = "https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"
}

# The log FORMAT follows the environment (text locally, JSON elsewhere; see
# logback.xml). Only levels are configured here.
observability {
  log_level = info              # root level, optionally "info,io.merkio.sqlportal=debug"; SCRIPT_PORTAL_LOG overrides it
  log_level = ${?LOG_LEVEL}
  metrics_enabled = true
  metrics_path = /metrics
}

database {
  # sqlite:file.db?mode=ro, postgres://user:pass@host/db, clickhouse://user:pass@host:8123/db
  url = "sqlite::memory:"
  url = ${?DATABASE_URL}
  # Plain JDBC connections, opened once and reused (in-memory SQLite: always one).
  max_connections = 5
  max_connections = ${?DATABASE_MAX_CONNECTIONS}
  acquire_timeout_secs = 5      # wait for a free connection, and connect timeout
  read_only_scripts = true      # only a single SELECT/WITH statement is accepted
  init_sql_files = []           # executed once at startup, after the migrations
  migrations {                  # off unless enabled; applies *.sql in name order
    enabled = false
    dir = migrations/sqlite
  }
  # tls { ... }                 # optional: replaces the shared top-level tls block
}

# ---------------------------------------------------------------------------
# Authentication. `enabled = false` switches off ALL authorizers: every request
# is then served as an anonymous administrator (use only on trusted networks).
# A provider's settings are only checked while it is enabled.
# ---------------------------------------------------------------------------
auth {
  enabled = true
  enabled = ${?AUTH_ENABLED}

  ldap {
    enabled = false
    enabled = ${?LDAP_ENABLED}
    url = "ldap://ldap.example.org:389"   # ldaps:// is supported too
    url = ${?LDAP_URL}
    start_tls = false
    start_tls = ${?LDAP_START_TLS}
    bind_dn = ""
    bind_dn = ${?LDAP_BIND_DN}
    bind_password = ""
    bind_password = ${?LDAP_BIND_PASSWORD}
    base_dn = ""
    base_dn = ${?LDAP_BASE_DN}
    user_filter = "(&(objectClass=person)(uid={username}))"   # {username} is escaped
    username_attribute = uid
    display_name_attribute = cn
    email_attribute = mail
    group_attribute = memberOf          # leave empty ("") if the server has no memberOf
    # Use a group search when memberOf is unavailable (e.g. plain OpenLDAP):
    # group_search {
    #   base_dn = "ou=groups,dc=example,dc=org"
    #   filter = "(&(objectClass=groupOfNames)(member={user_dn}))"
    #   name_attribute = cn
    # }
    timeout_secs = 5
  }

  oidc {
    enabled = false
    enabled = ${?OIDC_ENABLED}
    issuer_url = ""
    issuer_url = ${?OIDC_ISSUER_URL}
    client_id = script-portal
    client_id = ${?OIDC_CLIENT_ID}
    client_secret = ${?OIDC_CLIENT_SECRET}
    scopes = [profile, email]           # "openid" is always requested
    username_claim = preferred_username
    groups_claim = groups
  }
}

# ---------------------------------------------------------------------------
# Authorization: users/groups -> roles -> permissions. Wildcards: "*" grants
# everything, "prefix.*" grants every permission starting with "prefix.".
# Group keys may be an LDAP group CN, the full group DN, or an OIDC group name
# (matching is case-insensitive). Quote keys that contain '=' or ','.
# ---------------------------------------------------------------------------
access {
  default_roles = []                    # granted to every authenticated user
  roles {
    admin = ["*"]
    analyst = ["scripts.sales.*"]
    viewer = ["scripts.public.read"]
  }
  group_roles {
    analysts = [analyst]
    admins = [admin]
  }
  user_roles {}
  # Optional: load roles and permissions from a service instead (see README).
  # external {
  #   url = "https://permissions.internal/v1/permissions"
  #   timeout_secs = 3
  #   cache_ttl_secs = 300
  #   bearer_token = ${?PERMISSIONS_TOKEN}
  # }
}

include "scripts.conf"
