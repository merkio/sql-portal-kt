name: Release

# Publishes the distribution to the GitHub release and the Docker image to
# Docker Hub when a version tag (v1.2.3, v1.2.3-rc.1) is pushed.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME   Docker Hub user or organisation
#   DOCKERHUB_TOKEN      Docker Hub access token with read/write scope
# Optional repository variable:
#   DOCKERHUB_REPOSITORY image name, defaults to <DOCKERHUB_USERNAME>/script-portal

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag and run checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Tag must match the version in gradle.properties
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -m1 '^version=' gradle.properties | cut -d= -f2)
          if [ "$tag" != "$version" ]; then
            echo "Tag ($tag) does not match gradle.properties version ($version)" >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build

  distribution:
    name: Distribution (JVM, all platforms)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # One archive runs on every OS with Java 21: bin/script-portal (Unix) and
      # bin/script-portal.bat (Windows); the configuration is bundled in the jar.
      - name: Build archives
        run: |
          ./gradlew :sql-portal:deployment:installDist
          name="script-portal-${{ needs.verify.outputs.version }}"
          mkdir -p dist "$name"
          cp -r sql-portal/deployment/build/install/script-portal/. "$name/"
          cp README.md LICENSE "$name/"
          tar czf "dist/$name.tar.gz" "$name"
          zip -qr "dist/$name.zip" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256" && sha256sum "$name.zip" > "$name.zip.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/*
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: [verify, distribution]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distribution
          path: dist
      - name: Publish release with the distribution
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  docker:
    name: Docker image (Docker Hub)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_REPOSITORY || format('{0}/script-portal', secrets.DOCKERHUB_USERNAME) }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.verify.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_REPOSITORY || format('{0}/script-portal', secrets.DOCKERHUB_USERNAME) }}
          readme-filepath: ./README.md
